; Green Silk v3 – Modern DokuWiki Template
; RTL + Auto Dark/Light Mode Support

[stylesheets]
layout.css        = screen
design.css        = screen
responsive.css    = all

media.css         = screen
_mediaoptions.css = screen
_admin.css        = screen
_linkwiz.css      = screen
_subscription.css = screen
_mediamanager.css = screen
_tabs.css         = screen
_fileuploader.css = screen

rtl.css           = rtl
print.css         = print

[replacements]

; Primary text
__text__           = "#0f1f15"
__background__     = "#f8faf9"

; Brand green
__text_alt__       = "#059669"
__background_alt__ = "#d1fae5"

; Muted
__text_neu__       = "#5a7a68"
__background_neu__ = "#f0f6f2"

; Border
__border__         = "#d0e4d8"

; Subtle surfaces
__text_other__       = "#8aab98"
__background_other__ = "#e8f2ec"

; Links
__extern__    = "#059669"
__existing__  = "#059669"
__missing__   = "#dc2626"

; Highlight
__highlight__ = "#d1fae5"

; Legacy neutrals
__white__      = "#ffffff"
__lightgray__  = "#f0f6f2"
__mediumgray__ = "#8aab98"
__darkgray__   = "#5a7a68"
__black__      = "#0f1f15"

; Green spectrum
__lighter__    = "#f8faf9"
__light__      = "#f0f6f2"
__medium__     = "#d0e4d8"
__dark__       = "#059669"
__darker__     = "#047857"
