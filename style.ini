; Modern color scheme for wiki-template
; Clean, modern design with indigo accent

[stylesheets]
layout.css     = screen
design.css     = screen
style.css      = screen
responsive.css = all

media.css         = screen
_mediaoptions.css = screen
_admin.css        = screen
_linkwiz.css      = screen
_subscription.css = screen
_mediamanager.css  = screen
_tabs.css         = screen
_fileuploader.css = screen

rtl.css        = rtl
print.css      = print

[replacements]

; Main colors
__text__           = "#1a1a2e"
__background__     = "#f8f9fa"

; Alternative colors
__text_alt__       = "#6366f1"
__background_alt__ = "#eef2ff"

; Neutral colors
__text_neu__       = "#64748b"
__background_neu__ = "#f1f5f9"

; Border color
__border__         = "#e2e8f0"

; Other colors
__text_other__       = "#94a3b8"
__background_other__ = "#f8fafc"

; Links
__extern__    = "#4f46e5"
__existing__  = "#059669"
__missing__   = "#ef4444"

; Highlight
__highlight__ = "#fef08a"

; Legacy compatibility
__white__      = "#ffffff"
__lightgray__  = "#f1f5f9"
__mediumgray__ = "#94a3b8"
__darkgray__   = "#64748b"
__black__      = "#1a1a2e"

; Blue shades (legacy)
__lighter__   = "#f8fafc"
__light__     = "#f1f5f9"
__medium__    = "#e2e8f0"
__dark__      = "#6366f1"
__darker__    = "#4f46e5"
