; Silky Green Modern Color Scheme
; با پشتیبانی از RTL و تم تاریک/روشن خودکار

[stylesheets]
layout.css     = screen
design.css     = screen
style.css      = screen
responsive.css = all

media.css         = screen
_mediaoptions.css = screen
_admin.css        = screen
_linkwiz.css      = screen
_subscription.css = screen
_mediamanager.css  = screen
_tabs.css         = screen
_fileuploader.css = screen

rtl.css        = rtl
print.css      = print

[replacements]

; Light theme - Main colors
__text__           = "#1a2e1a"
__background__     = "#f7faf7"

; Alternative colors
__text_alt__       = "#059669"
__background_alt__ = "#ecfdf5"

; Neutral colors
__text_neu__       = "#64756b"
__background_neu__ = "#f0f7f0"

; Border
__border__         = "#dce8dc"

; Other colors
__text_other__       = "#8fa896"
__background_other__ = "#fafcfa"

; Links
__extern__    = "#059669"
__existing__  = "#059669"
__missing__   = "#ef4444"

; Highlight
__highlight__ = "#d1fae5"

; Legacy
__white__      = "#ffffff"
__lightgray__  = "#f0f7f0"
__mediumgray__ = "#8fa896"
__darkgray__   = "#64756b"
__black__      = "#1a2e1a"

; Green spectrum
__lighter__   = "#fafcfa"
__light__     = "#f0f7f0"
__medium__    = "#dce8dc"
__dark__      = "#059669"
__darker__    = "#047857"
